<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>RoadWatch Offline</title>
    <style>
      body {
        margin: 0;
        font-family: Arial, sans-serif;
        background: #0F1117;
        color: #F1F5F9;
        display: grid;
        place-items: center;
        min-height: 100vh;
        text-align: center;
        padding: 24px;
      }
      .card {
        background: #1A1E2E;
        border: 1px solid #2D3748;
        border-radius: 16px;
        padding: 24px;
        max-width: 360px;
      }
      h1 {
        font-size: 20px;
        margin: 0 0 10px;
      }
      p {
        font-size: 14px;
        color: #94A3B8;
        margin: 0;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>You are offline</h1>
      <p>Reconnect to continue using RoadWatch. Cached pages are still available.</p>
    </div>
  </body>
</html>
